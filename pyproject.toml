[build-system]
requires = ["uv_build==0.12.13"]
build-backend = "uv_build"

[project]
name = "portfolio-forecasting"
version = "0.1.0"
description = "A reproducible foundation for daily equity forecasting and allocation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["tzdata==2026.4"]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.7",
]

[tool.uv]
required-version = "==0.12.13"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --import-mode=importlib"
filterwarnings = ["error"]
