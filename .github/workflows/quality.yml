name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.13"
          enable-cache: false
      - name: Install pinned interpreter and locked environment
        run: |
          uv python install
          uv sync --locked
      - name: Check configuration and source without applying fixes
        run: make check
      - name: Build and verify a fresh runtime-only package installation
        run: make package-smoke
      - name: Verify disposable PostgreSQL and Supabase API contracts
        run: make database-smoke
      - name: Install distro proxy configuration validator
        run: |
          sudo apt-get update
          sudo apt-get install --yes caddy
      - name: Verify deployment and scheduling contracts
        run: make deployment-smoke
      - name: Verify checks did not modify tracked files
        run: git diff --exit-code
